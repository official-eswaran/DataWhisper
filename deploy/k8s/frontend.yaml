apiVersion: apps/v1
kind: Deployment
metadata:
  name: datawhisper-frontend
  namespace: datawhisper
  labels:
    app.kubernetes.io/name: datawhisper-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: datawhisper-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: datawhisper-frontend
    spec:
      containers:
        - name: frontend
          image: datawhisper/frontend:latest # replace with your registry/tag
          ports:
            - containerPort: 80
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "128Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: datawhisper
  labels:
    app.kubernetes.io/name: datawhisper-frontend
spec:
  selector:
    app.kubernetes.io/name: datawhisper-frontend
  ports:
    - name: http
      port: 80
      targetPort: 80
