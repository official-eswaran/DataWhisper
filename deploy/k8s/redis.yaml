# In-cluster Redis for the conversation store + rate limiter.
# For production prefer a managed, HA Redis (ElastiCache / Memorystore / Upstash)
# and point REDIS_URL at it instead of deploying this.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: datawhisper
  labels:
    app.kubernetes.io/name: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          args: ["redis-server", "--save", "", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
          ports:
            - containerPort: 6379
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "320Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: datawhisper
spec:
  selector:
    app.kubernetes.io/name: redis
  ports:
    - port: 6379
      targetPort: 6379
