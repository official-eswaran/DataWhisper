apiVersion: apps/v1
kind: Deployment
metadata:
  name: datawhisper-backend
  namespace: datawhisper
  labels:
    app.kubernetes.io/name: datawhisper-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: datawhisper-backend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: datawhisper-backend
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: backend
          image: datawhisper/backend:latest # replace with your registry/tag
          # Migrations run in the separate Job, so serve directly here.
          command: ["gunicorn"]
          args:
            - "app.main:app"
            - "-k"
            - "uvicorn.workers.UvicornWorker"
            - "-w"
            - "2"
            - "-b"
            - "0.0.0.0:8000"
            - "--timeout"
            - "120"
            - "--graceful-timeout"
            - "30"
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: datawhisper-config
            - secretRef:
                name: datawhisper-secrets
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
          # DuckDB datasets live in object storage (DATASET_STORAGE_BACKEND=s3);
          # each pod materialises sessions to this ephemeral cache on demand, so
          # no ReadWriteMany volume is needed and any replica can serve any
          # session. Set DATASET_STORAGE_BACKEND=local + an RWX PVC only if you
          # deliberately want shared-filesystem storage instead.
          volumeMounts:
            - name: data
              mountPath: /app/data
      volumes:
        - name: data
          emptyDir:
            sizeLimit: 20Gi
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: datawhisper
  labels:
    app.kubernetes.io/name: datawhisper-backend
spec:
  selector:
    app.kubernetes.io/name: datawhisper-backend
  ports:
    - name: http
      port: 8000
      targetPort: 8000
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: datawhisper-backend
  namespace: datawhisper
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: datawhisper-backend
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: datawhisper-backend
  namespace: datawhisper
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: datawhisper-backend
