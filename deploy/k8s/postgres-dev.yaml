# DEV / LOCAL ONLY. Do not use in production — a single-pod StatefulSet has no
# HA, no PITR, no managed backups. Production uses managed Postgres provisioned
# by deploy/terraform. Not referenced by kustomization.yaml by design.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: datawhisper
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - name: POSTGRES_USER
              value: datawhisper
            - name: POSTGRES_DB
              value: datawhisper
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: datawhisper-secrets
                  key: ADMIN_PASSWORD # dev convenience; use a dedicated secret in real setups
          ports:
            - containerPort: 5432
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "datawhisper"]
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            - name: pgdata
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: pgdata
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: datawhisper
spec:
  selector:
    app.kubernetes.io/name: postgres
  ports:
    - port: 5432
      targetPort: 5432
