# EXAMPLE ONLY — do not commit real secrets. In production, generate these with
# a secrets manager (Sealed Secrets, External Secrets Operator, Vault, or your
# cloud provider's CSI driver). Replace the placeholder values before applying.
apiVersion: v1
kind: Secret
metadata:
  name: datawhisper-secrets
  namespace: datawhisper
type: Opaque
stringData:
  # Generate: python3 -c "import secrets; print(secrets.token_hex(32))"
  SECRET_KEY: "REPLACE_WITH_64_CHAR_HEX_SECRET"
  DATABASE_URL: "postgresql+psycopg://datawhisper:REPLACE_PASSWORD@postgres:5432/datawhisper"
  # Only used to seed the first demo org on an empty database.
  ADMIN_PASSWORD: "REPLACE_ADMIN_PASSWORD"
  MANAGER_PASSWORD: "REPLACE_MANAGER_PASSWORD"
  # Optional — error tracking. Leave unset to disable Sentry.
  # SENTRY_DSN: "https://<key>@<org>.ingest.sentry.io/<project>"
