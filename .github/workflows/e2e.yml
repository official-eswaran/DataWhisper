# End-to-end smoke (issue #20). Runs the real browser → API → Ollama → DuckDB
# flow via frontend/e2e.
#
# Deliberately NOT part of the per-PR ci.yml: it pulls a multi-GB model and does
# CPU inference, which would add many minutes to every push. This runs on manual
# dispatch and a nightly schedule instead.
#
# NOTE: this workflow has not been executed in GitHub Actions yet — it was
# authored and the flow itself verified locally (see frontend/e2e/README.md).
# The Ollama setup (install + model pull) is the part most likely to need
# tuning on the hosted runner; treat the first Actions run as the real check.
name: e2e

on:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * *" # nightly, 04:00 UTC

jobs:
  e2e:
    name: Full-flow smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend deps
        working-directory: backend
        run: pip install -r requirements-dev.txt

      - uses: actions/setup-node@v4
        with:
          # Match ci.yml and frontend/Dockerfile — see the note there.
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend deps
        working-directory: frontend
        run: npm ci
      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Start Ollama and pull the model
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          ollama serve &
          # Wait for the daemon, then pull the model the app defaults to.
          for i in $(seq 1 30); do
            curl -sf http://localhost:11434/api/tags >/dev/null && break
            sleep 1
          done
          ollama pull llama3.2:3b

      - name: Run E2E
        working-directory: frontend
        run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
