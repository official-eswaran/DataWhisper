name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend — lint, test, audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check app tests

      - name: Test with coverage gate
        env:
          DEBUG: "true"
          SECRET_KEY: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
        # 85, not 90: actual coverage is ~90% but core/billing.py sits at 82%,
        # so a 90 gate would fail on any change that touches billing without
        # adding tests. Raise this again once billing catches up (#28).
        run: pytest --cov=app --cov-report=term-missing --cov-fail-under=85

      - name: Dependency vulnerability audit (pip-audit)
        run: pip-audit -r requirements.txt --strict --progress-spinner off

  frontend:
    name: Frontend — build, test, audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # Keep in step with frontend/Dockerfile's build stage. Node 20 went
          # EOL on 2026-04-30; 24 is the Active LTS. Dependabot cannot catch
          # this drifting — it bumps the setup-node action, never this input —
          # so it is on whoever reads the Node release calendar.
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Dependency audit (shipped/runtime deps only)
        # The frontend ships a static build, so only runtime deps matter; the
        # dev toolchain (Vite/Vitest) is excluded. Fails on high/critical
        # runtime advisories that are not explicitly allowlisted below.
        #
        # ALLOWLIST — GHSA-qwww-vcr4-c8h2 (react-router, RSC-mode CSRF bypass)
        #
        # There is currently no clean react-router 7.x. Versions below 7.12.0
        # carry 14 high advisories including an unauthenticated RCE via the
        # vendored turbo-stream; 7.12.0-8.2.0 carry this single one. We pin the
        # newest (^7.18.1) and accept this advisory because it only affects RSC
        # mode, and this app is a Vite SPA using BrowserRouter — no RSC, no
        # server actions. Everything else still fails the build.
        #
        # Re-check when a fixed release lands above 8.2.0, then drop the entry.
        run: |
          npm audit --omit=dev --json > audit.json || true
          node -e '
            const a = JSON.parse(require("fs").readFileSync("audit.json", "utf8"));
            const ALLOW = new Set(["GHSA-qwww-vcr4-c8h2"]);
            const ids = new Set();
            for (const v of Object.values(a.vulnerabilities ?? {})) {
              if (!["high", "critical"].includes(v.severity)) continue;
              for (const via of v.via ?? []) {
                if (typeof via === "object" && via.url) ids.add(via.url.split("/").pop());
              }
            }
            const unlisted = [...ids].filter((id) => !ALLOW.has(id));
            if (unlisted.length) {
              console.error("Unallowlisted high/critical advisories:\n  " + unlisted.join("\n  "));
              process.exit(1);
            }
            console.log("Audit gate passed. Allowlisted and reviewed: " + [...ALLOW].join(", "));
          '

  images:
    name: Images — build & scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build backend image
        run: docker build -t datawhisper-backend:${{ github.sha }} ./backend
      - name: Build frontend image
        run: docker build -t datawhisper-frontend:${{ github.sha }} ./frontend

      - name: Scan backend image (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: datawhisper-backend:${{ github.sha }}
          severity: "HIGH,CRITICAL"
          ignore-unfixed: true
          exit-code: "1"
      - name: Scan frontend image (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: datawhisper-frontend:${{ github.sha }}
          severity: "HIGH,CRITICAL"
          ignore-unfixed: true
          exit-code: "1"
